<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="cloudGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Rounded Hexagon / Shield -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0D131F" stroke="url(#primaryGrad)" stroke-width="2"/>
  
  <!-- Stylized Cloud Outline with glow -->
  <path d="M22 36a8 8 0 0 1-1.5-15.85A12 12 0 0 1 43.5 22.5 7 7 0 0 1 45 36h-23z" 
        fill="url(#cloudGlow)" opacity="0.3" filter="url(#glow)"/>
        
  <!-- Code Brackets / Terminal Prompt Symbol -->
  <path d="M20 28l-5 4 5 4" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M44 28l5 4-5 4" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28 40h12" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Terminal Prompt Slash / MK initial monogram -->
  <path d="M35 24l-6 16" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
</svg>
