<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="dtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="100%" stop-color="#020B09"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="#040D12"/>
  <rect x="1" y="1" width="598" height="378" rx="15" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#061A14"/>
  <circle cx="28" cy="21" r="5" fill="#EF4444"/>
  <circle cx="44" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="21" r="5" fill="#10B981"/>
  <text x="80" y="25" fill="#10B981" font-family="monospace" font-size="12" font-weight="bold">mukesh@cloud-terminal:~ (zsh)</text>

  <rect x="445" y="11" width="130" height="20" rx="6" fill="#10B981" fill-opacity="0.15"/>
  <text x="458" y="25" fill="#34D399" font-family="monospace" font-size="10">⚡ AWS Amplify CI/CD</text>

  <!-- Terminal Content Area -->
  <rect x="25" y="60" width="550" height="295" rx="8" fill="#03080A" stroke="#064E3B"/>
  
  <text x="45" y="90" fill="#34D399" font-family="monospace" font-size="13">$ mukesh --status --skills</text>
  
  <text x="45" y="120" fill="#10B981" font-family="monospace" font-size="11">[OK] Initializing AWS Hackathon Candidate Profile: Mukesh Kumar</text>
  <text x="45" y="140" fill="#6EE7B7" font-family="monospace" font-size="11">Role: Computer Science Student | Cloud &amp; Generative AI Engineer</text>
