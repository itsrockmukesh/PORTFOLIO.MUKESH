  <!-- ASCII Skill Bars -->
  <text x="45" y="195" fill="#A7F3D0" font-family="monospace" font-size="11">Cloud Computing [AWS / GCP] : [██████████████████  ] 92%</text>
  <text x="45" y="220" fill="#A7F3D0" font-family="monospace" font-size="11">Generative AI &amp; Python     : [█████████████████   ] 88%</text>
  <text x="45" y="245" fill="#A7F3D0" font-family="monospace" font-size="11">Modern Full-Stack Dev       : [████████████████    ] 85%</text>

  <text x="45" y="280" fill="#34D399" font-family="monospace" font-size="13">$ cat secret-hint.txt</text>
  <text x="45" y="305" fill="#FCD34D" font-family="monospace" font-size="11">"Press `~` anywhere on this site to unlock developer commands!"</text>
  
