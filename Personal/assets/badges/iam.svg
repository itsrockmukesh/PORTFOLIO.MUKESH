<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335"/>
      <stop offset="50%" stop-color="#FBBC04"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>
    <filter id="badgeGlow2">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#EA4335" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Outer Octagon Shield -->
  <polygon points="80,10 135,32 150,90 115,142 80,154 45,142 10,90 25,32" 
           fill="url(#bgGrad2)" stroke="url(#borderGrad2)" stroke-width="4" filter="url(#badgeGlow2)"/>
  
  <!-- Inner Ring -->
  <circle cx="80" cy="78" r="48" fill="#151D2F" stroke="#FBBC04" stroke-width="1.5" stroke-dasharray="4 2"/>
  
  <!-- Shield with Key / IAM Badge -->
  <path d="M80 44L102 54V76C102 91 92 104 80 109C68 104 58 91 58 76V54L80 44Z" 
        fill="#1E293B" stroke="#FBBC04" stroke-width="2.5"/>
  
  <!-- Security Key inside Shield -->
  <circle cx="76" cy="70" r="7" stroke="#4285F4" stroke-width="2.5" fill="none"/>
  <path d="M81 74L92 85M87 80L90 83M90 77L93 80" stroke="#4285F4" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Service Account User Icon -->
  <circle cx="80" cy="56" r="3.5" fill="#34A853"/>

  <!-- Verified Star Seal -->
  <circle cx="80" cy="132" r="9" fill="#EA4335"/>
  <path d="M77 132l2 2 4-4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
