  <circle cx="62" cy="60" r="2.5" fill="#34A853"/>
  <line x1="72" y1="60" x2="98" y2="60" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

  <rect x="54" y="74" width="52" height="16" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
