<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="borderGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>
    <filter id="badgeGlow4">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8B5CF6" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Outer Octagon Shield -->
  <polygon points="80,10 135,32 150,90 115,142 80,154 45,142 10,90 25,32" 
           fill="url(#bgGrad4)" stroke="url(#borderGrad4)" stroke-width="4" filter="url(#badgeGlow4)"/>
  
  <!-- Inner Ring -->
  <circle cx="80" cy="78" r="48" fill="#1A1830" stroke="#C084FC" stroke-width="1.5" stroke-dasharray="4 2"/>
  
  <!-- AI Sparkle Core (4-point star) -->
  <path d="M80 46 C80 62 86 68 102 68 C86 68 80 74 80 90 C80 74 74 68 58 68 C74 68 80 62 80 46 Z" 
        fill="url(#borderGrad4)"/>

  <!-- Neural Network Nodes & Links -->
  <circle cx="56" cy="52" r="4" fill="#38BDF8"/>
  <circle cx="104" cy="52" r="4" fill="#F472B6"/>
  <circle cx="56" cy="98" r="4" fill="#A78BFA"/>
  <circle cx="104" cy="98" r="4" fill="#38BDF8"/>
  <circle cx="80" cy="106" r="4" fill="#FBBF24"/>

  <line x1="56" y1="52" x2="72" y2="64" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="104" y1="52" x2="88" y2="64" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="56" y1="98" x2="72" y2="76" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="104" y1="98" x2="88" y2="76" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="80" y1="90" x2="80" y2="102" stroke="#818CF8" stroke-width="1.5"/>

  <!-- Verified Star Seal -->
  <circle cx="80" cy="132" r="9" fill="#8B5CF6"/>
  <path d="M77 132l2 2 4-4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
