<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="cpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cpAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="cpWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="600" height="380" rx="16" fill="url(#cpBg)"/>
  <rect x="1" y="1" width="598" height="378" rx="15" stroke="#334155" stroke-width="1.5"/>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#1E293B"/>
  <circle cx="28" cy="21" r="5" fill="#EF4444"/>
  <circle cx="44" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="21" r="5" fill="#10B981"/>
  <rect x="90" y="12" width="220" height="18" rx="6" fill="#0F172A"/>
  <text x="105" y="25" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">aws-console.cloudpulse.io/live</text>

  <!-- AWS Badge -->
  <rect x="475" y="11" width="95" height="20" rx="10" fill="#FF9900" fill-opacity="0.2"/>
  <text x="490" y="25" fill="#FF9900" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">AWS Cloud</text>

  <!-- Metrics Grid -->
  <rect x="30" y="65" width="160" height="85" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="45" y="88" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Lambda Invocations</text>
  <text x="45" y="122" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold">1.42M</text>
  <text x="135" y="122" fill="#10B981" font-family="-apple-system, sans-serif" font-size="12">+18.4%</text>

  <rect x="220" y="65" width="160" height="85" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="235" y="88" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">P99 Latency</text>
  <text x="235" y="122" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold">38ms</text>
  <text x="315" y="122" fill="#10B981" font-family="-apple-system, sans-serif" font-size="12">-4.2%</text>

  <rect x="410" y="65" width="160" height="85" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="425" y="88" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Error Rate</text>
  <text x="425" y="122" fill="#10B981" font-family="-apple-system, sans-serif" font-size="24" font-weight="bold">0.002%</text>
  <text x="525" y="122" fill="#10B981" font-family="-apple-system, sans-serif" font-size="12">OK</text>

  <!-- Live Traffic Chart Area -->
  <rect x="30" y="175" width="540" height="175" rx="12" fill="#111827" stroke="#1F2937"/>
  <text x="50" y="202" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Real-Time Event Stream • Amazon CloudWatch</text>
  
  <!-- Grid Lines -->
  <line x1="50" y1="230" x2="550" y2="230" stroke="#1F2937" stroke-dasharray="3 3"/>
  <line x1="50" y1="270" x2="550" y2="270" stroke="#1F2937" stroke-dasharray="3 3"/>
  <line x1="50" y1="310" x2="550" y2="310" stroke="#1F2937" stroke-dasharray="3 3"/>

  <!-- Wave Area Chart -->
  <path d="M50 310 Q 110 240, 180 270 T 320 220 T 440 250 T 550 190 L 550 330 L 50 330 Z" fill="#38BDF8" fill-opacity="0.12"/>
  <path d="M50 310 Q 110 240, 180 270 T 320 220 T 440 250 T 550 190" stroke="url(#cpWave)" stroke-width="3" fill="none"/>

  <!-- Glowing Point -->
  <circle cx="550" cy="190" r="5" fill="#38BDF8"/>
  <circle cx="550" cy="190" r="10" stroke="#38BDF8" stroke-width="1.5" opacity="0.5"/>
</svg>
